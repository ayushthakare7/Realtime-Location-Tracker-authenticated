services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      RAG_SERVICE_URL: http://rag-service:8001
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:?Set RAG_SERVICE_TOKEN in your .env}
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in your .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in your .env}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - rag-service
    restart: unless-stopped

  rag-service:
    build:
      context: ./rag-service-python
    environment:
      RAG_PORT: 8001
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:?Set RAG_SERVICE_TOKEN in your .env}
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in your .env}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-location_tracker}
      LOCATION_EVENTS_COLLECTION: ${LOCATION_EVENTS_COLLECTION:-locationevents}
      RAG_VECTOR_INDEX: ${RAG_VECTOR_INDEX:-location_event_vector_index_384}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in your .env}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    expose:
      - "8001"
    restart: unless-stopped
