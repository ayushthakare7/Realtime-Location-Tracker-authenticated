name: Node.js tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check modular backend JavaScript syntax
        run: |
          node --check src/controllers/friendshipController.js
          node --check src/controllers/historyController.js
          node --check src/controllers/mapAssistantController.js
          node --check src/controllers/locationQueryController.js
          node --check src/services/locationQueryExecution.service.js
          node --check src/services/locationAnswerFormatting.service.js
          node --check src/controllers/safetyNotificationController.js
          node --check src/controllers/safetyJourneyLifecycleController.js
          node --check src/routes/trackerRoutes.js
          node --check src/routes/safetyJourneyRoutes.js
          node --check mobility-service/src/controllers/destinationController.js
          node --check mobility-service/src/controllers/tripsController.js
          node --check mobility-service/src/controllers/sharedTripsController.js
          node --check mobility-service/src/routes/trips.js
