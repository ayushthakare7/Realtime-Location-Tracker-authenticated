name: Build Reva Android APK

on:
  workflow_dispatch:
    inputs:
      reva_web_url:
        description: "Full HTTPS URL of the deployed Reva app (the host serving /tracker and /mobility)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REVA_WEB_URL: ${{ inputs.reva_web_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build native web bridges
        run: |
          npm run mobile:build
          npm run mobile:push-build

      - name: Create Capacitor configuration for the remote Reva app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          printf '<!doctype html><html><head><meta charset="utf-8"><title>Reva</title></head><body></body></html>\n' > www/index.html
          node - <<'NODE'
          const fs = require("fs");
          const url = process.env.REVA_WEB_URL;
          if (!url || !url.startsWith("https://")) {
            throw new Error("REVA_WEB_URL must be a valid HTTPS URL.");
          }
          fs.writeFileSync("capacitor.config.json", JSON.stringify({
            appId: "com.reva.locationtracker",
            appName: "Reva",
            webDir: "www",
            server: {
              url,
              cleartext: false,
              allowNavigation: [new URL(url).hostname]
            }
          }, null, 2) + "\\n");
          NODE

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Firebase Messaging in generated Android project
        shell: bash
        run: |
          set -euo pipefail
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re

          root_gradle = Path("android/build.gradle")
          if not root_gradle.exists():
              raise SystemExit("Expected generated android/build.gradle (Groovy) was not found.")
          root_text = root_gradle.read_text()
          if "com.google.gms:google-services" not in root_text:
              root_text, count = re.subn(
                  r"(dependencies\s*\{)",
                  r"\1\n        classpath 'com.google.gms:google-services:4.4.2'",
                  root_text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not add Google Services Gradle plugin to android/build.gradle.")
              root_gradle.write_text(root_text)

          app_gradle = Path("android/app/build.gradle")
          app_text = app_gradle.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text += "\napply plugin: 'com.google.gms.google-services'\n"
          if "firebase-bom" not in app_text:
              app_text, count = re.subn(
                  r"(dependencies\s*\{)",
                  r"\1\n    implementation platform('com.google.firebase:firebase-bom:33.16.0')\n    implementation 'com.google.firebase:firebase-messaging'",
                  app_text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not add Firebase Messaging dependency to android/app/build.gradle.")
          app_gradle.write_text(app_text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest_text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if "android.permission.POST_NOTIFICATIONS" not in manifest_text:
              manifest_text = manifest_text.replace("<manifest ", "<manifest ", 1)
              manifest_text = re.sub(r"(<manifest[^>]*>)", r"\1\n" + permission, manifest_text, count=1)
          manifest.write_text(manifest_text)
          PY

      - name: Enforce native orientation by page
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/reva/locationtracker
          cat > android/app/src/main/java/com/reva/locationtracker/MainActivity.java <<'JAVA'
          package com.reva.locationtracker;

          import android.content.pm.ActivityInfo;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private final Handler orientationHandler = new Handler(Looper.getMainLooper());
            private int lastRequestedOrientation = -1;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
              lastRequestedOrientation = ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE;
              super.onCreate(savedInstanceState);
              orientationHandler.post(orientationCheck);
            }

            private final Runnable orientationCheck = new Runnable() {
              @Override
              public void run() {
                try {
                  com.getcapacitor.Bridge currentBridge = getBridge();
                  WebView webView = currentBridge == null ? null : currentBridge.getWebView();
                  String url = webView == null ? null : webView.getUrl();
                  if (url != null) {
                    String path = android.net.Uri.parse(url).getPath();
                    if (path == null) path = "/";
                    String normalizedPath = path.replaceAll("/+$", "");
                    boolean portraitPage = normalizedPath.matches("(?i)(^|/)(login|register)$");
                    int wanted = portraitPage
                      ? ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                      : ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE;
                    if (wanted != lastRequestedOrientation) {
                      setRequestedOrientation(wanted);
                      lastRequestedOrientation = wanted;
                    }
                  }
                } catch (Exception ignored) {
                  // Retry on the next tick while the Capacitor WebView is starting.
                }
                orientationHandler.postDelayed(this, 400);
              }
            };

            @Override
            public void onDestroy() {
              orientationHandler.removeCallbacks(orientationCheck);
              super.onDestroy();
            }
          }
          JAVA

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reva-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
