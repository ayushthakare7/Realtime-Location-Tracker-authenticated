[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:rag]
command=/opt/reva-venv/bin/python /app/rag_service/main.py
directory=/app/rag_service
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8001",HOST="127.0.0.1"

[program:mobility]
command=node /app/mobility-service/server.js
directory=/app/mobility-service
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="3101",MONGODB_URI="%(ENV_MONGO_URI)s",MAIN_APP_INTERNAL_URL="http://127.0.0.1:10000/api/internal/mobility-events"

[program:main]
command=node /app/server.js
directory=/app
autostart=true
autorestart=true
startsecs=8
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="10000",RAG_SERVICE_URL="http://127.0.0.1:8001",MOBILITY_SERVICE_URL="http://127.0.0.1:3101",MONGODB_URI="%(ENV_MONGO_URI)s"
